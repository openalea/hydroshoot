{% set pyproject = load_file_data('../pyproject.toml', from_recipe_dir=True) %}
{% set name = pyproject.get('project').get('name') %}
{% set description = pyproject.get('project').get('description') %}
{% set version = environ.get('SETUPTOOLS_SCM_PRETEND_VERSION', "0.0.0.dev") %}
{% set license = pyproject.get('project').get('license') %}
{% set home = pyproject.get('project', {}).get('urls', {}).get('Homepage', '') %}
{% set build_deps = pyproject.get("build-system", {}).get("requires", []) %}
{% set deps = pyproject.get('project', {}).get('dependencies', []) %}
{% set optional_deps = pyproject.get('project', {}).get('optional-dependencies', {}) %}
{% set arch_deps = optional_deps.get('architecture', []) %}
{% set energy_deps = optional_deps.get('energy', []) %}
{% set irrad_deps = optional_deps.get('irradiance', []) %}
{% set test_deps = optional_deps.get('test', []) %}
{% set conda_deps = pyproject.get('tool', {}).get('conda', {}).get('environment', {}).get('dependencies',[]) %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  number: 0
  script:
    - {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-build-isolation -vv

requirements:
  host:
    - python
    - setuptools_scm
    {% for dep in build_deps %}
    - {{ dep }}
    {% endfor  %}

  run:
    - python
    {% for dep in deps + conda_deps + arch_deps + energy_deps + irrad_deps %}
    - {{ dep }}
    {% endfor %}


test:
  imports:
    - {{ name }}
  requires:
    {% for dep in test_deps %}
    - {{ dep }}
    {% endfor %}
  source_files:
    - test/
  commands:
    - pytest -v

about:
  home: {{ home }}
  summary: {{ description }}
  license: {{ license }}

extra:
  recipe-maintainers:
    - RamiALBASHA
    - pradal
    - christian34
